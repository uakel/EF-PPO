---
env_args: {}
id: 0
tonic:
  after_training: None
  header: |
    from deprl.vendor.tonic.torch.agents.ppo import PPO
    from deprl.vendor.tonic.replays import Segment
    from ef_ppo.base_trainer import BaseTrainer
    import gait_40_dof_22_musc_sagittal
  agent: |
    PPO(
      replay=Segment(size=128)
    )
  before_training: None
  checkpoint: last
  environment: |
    deprl.environments.Gym('gait_40_dof_22_musc_sagittal_vel_reward-v0')
  full_save: False
  name: ppo
  parallel: 16
  sequential: 32
  resume: 1
  seed: 0
  test_environment: null
  trainer: |
    BaseTrainer(epoch_steps = 128 * 16 * 32, 
                save_steps = 128 * 16 * 32 * 16)
working_dir: .
